name: Build 轻聊壳 (轻聊 + 尤雾排单)

on:
  push:
    paths:
      - 'QLAdmin/**'
      - 'QLWapian/**'
      - '.github/workflows/build-shells.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - run: brew install xcodegen

      - name: Generate projects
        run: |
          cd QLAdmin && xcodegen generate --spec project.yml
          cd ../QLWapian && xcodegen generate --spec project.yml

      # ---------- 主力版：iOS 15+（15.4.1 / 16.1 的 TrollStore） ----------
      - name: Build QLAdmin (iOS 15+)
        run: |
          cd QLAdmin
          xcodebuild -project QLAdmin.xcodeproj -scheme QLAdmin \
            -sdk iphoneos -configuration Release -derivedDataPath Build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Build QLWapian (iOS 15+)
        run: |
          cd QLWapian
          xcodebuild -project QLWapian.xcodeproj -scheme QLWapian \
            -sdk iphoneos -configuration Release -derivedDataPath Build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # ---------- 兼容版：iOS 14.0+（iPad mini 5 / 14.8.1），iPhone+iPad 通用 ----------
      - name: Build QLAdmin (iOS 14+)
        run: |
          cd QLAdmin
          xcodebuild -project QLAdmin.xcodeproj -scheme QLAdmin \
            -sdk iphoneos -configuration Release -derivedDataPath Build14 \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build14.log
          exit ${PIPESTATUS[0]}

      - name: Build QLWapian (iOS 14+)
        run: |
          cd QLWapian
          xcodebuild -project QLWapian.xcodeproj -scheme QLWapian \
            -sdk iphoneos -configuration Release -derivedDataPath Build14 \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build14.log
          exit ${PIPESTATUS[0]}

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            QLAdmin/build.log
            QLWapian/build.log
            QLAdmin/build14.log
            QLWapian/build14.log
          compression-level: 0

      - name: Show errors
        if: failure()
        run: |
          grep -n "error:" QLAdmin/build.log QLWapian/build.log QLAdmin/build14.log QLWapian/build14.log 2>/dev/null | head -60 | \
            while IFS= read -r line; do echo "::error::$line"; done

      - name: Package IPAs
        run: |
          set -e
          pack15() { mkdir -p out15/Payload && cp -r "$1" out15/Payload/ && (cd out15 && rm -f "../$2" && zip -qr "../$2" Payload); }
          pack14() { mkdir -p out14/Payload && cp -r "$1" out14/Payload/ && (cd out14 && rm -f "../$2" && zip -qr "../$2" Payload); }
          pack15 QLAdmin/Build/Build/Products/Release-iphoneos/QLAdmin.app    "轻聊.ipa"
          pack15 QLWapian/Build/Build/Products/Release-iphoneos/QLWapian.app  "尤雾排单.ipa"
          pack14 QLAdmin/Build14/Build/Products/Release-iphoneos/QLAdmin.app   "轻聊-兼容14.ipa"
          pack14 QLWapian/Build14/Build/Products/Release-iphoneos/QLWapian.app "尤雾排单-兼容14.ipa"
          ls -la *.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-shells
          path: |
            轻聊.ipa
            尤雾排单.ipa
            轻聊-兼容14.ipa
            尤雾排单-兼容14.ipa
          compression-level: 0
