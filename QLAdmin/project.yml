name: QLAdmin
options:
  bundleIdPrefix: com.qingliao
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "140"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"

targets:
  QLAdmin:
    type: application
    platform: iOS
    sources:
      - path: QLAdmin
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: QLAdmin/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.admin
        PRODUCT_NAME: QLAdmin
