name: QLWapian
options:
  bundleIdPrefix: com.qingliao
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"

targets:
  QLWapian:
    type: application
    platform: iOS
    sources:
      - path: QLWapian
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: QLWapian/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.youwu
        PRODUCT_NAME: QLWapian
